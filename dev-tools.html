<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dev Tools — TransfermarktDD</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h2 {
            color: #00aaff;
        }
        .player {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .player h3 {
            margin: 0 0 10px;
            color: #fff;
        }
        .rec {
            color: #4ec9b0;
        }
        .current {
            color: #ce9178;
        }
        .diff {
            color: #d7ba7d;
        }
    </style>
</head>
<body>

<h2>📊 Рекомендуемые трансферные цены</h2>
<div id="output"></div>

<script src="players-data.js"></script>
<script>
    function getAgeCoef(age) {
        if (age >= 8 && age <= 11) return 0.6;
        if (age >= 12 && age <= 13) return 0.7;
        if (age >= 14 && age <= 15) return 0.8;
        if (age >= 16 && age <= 18) return 1.0;
        if (age >= 19 && age <= 21) return 0.9;
        return 0.8;
    }

    function getDiscipline(yc, rc) {
        if (rc >= 2) return 0.3;
        if (rc >= 1) return 0.5;
        if (yc >= 4) return 0.7;
        if (yc >= 2) return 0.9;
        return 1.0;
    }

    const output = document.getElementById('output');

    playersData.forEach(p => {
        const ageCoef = getAgeCoef(p.age);
        const stats = p.stats;
        const discipline = getDiscipline(stats.yellowCards, stats.redCards);
        const position = p.position;

        // Базовый рейтинг зависит от позиции
        let baseRating;

        if (position === 'forward') {
            // Нападающий: голы важнее всего
            baseRating = (ageCoef * 30) + (stats.goals * 4) + (stats.assists * 2) + (stats.matches * 1);
        }
        else if (position === 'midfielder') {
            // Полузащитник: передачи и матчи важнее голов
            baseRating = (ageCoef * 30) + (stats.assists * 3) + (stats.goals * 2) + (stats.matches * 2);
        }
        else if (position === 'defender') {
            // Защитник: матчи и передачи
            baseRating = (ageCoef * 30) + (stats.matches * 3) + (stats.assists * 2) + (stats.goals * 1);
        }
        else if (position === 'goalkeeper') {
            // Вратарь: сухие матчи и пропущенные
            const gs = p.goalieStats || { cleanSheets: 0, conceded: 0, matches: 0 };
            baseRating = (ageCoef * 30) + (gs.cleanSheets * 5) + (gs.matches * 2) - (gs.conceded * 1);
        }
        else {
            // По умолчанию — универсальная формула
            baseRating = (ageCoef * 30) + (stats.goals * 3) + (stats.assists * 2) + (stats.matches * 1.5);
        }

        const ratingCoef = baseRating / 40;
        const BASE = 80;
        const recommended = Math.round(BASE * ratingCoef * ageCoef * discipline);

        const diff = p.price - recommended;
        const sign = diff > 0 ? '+' : '';

        output.innerHTML += `
            <div class="player">
                <h3>${p.name} (${p.mainPosition})</h3>
                <p class="rec">Рекомендуемая: ${recommended}₽</p>
                <p class="current">Текущая: ${p.price}₽ ${p.priceOverride > 0 ? '(вручную)' : '(авто)'}</p>
                ${p.priceOverride > 0 && diff !== 0 ? `<p class="diff">Разница: ${sign}${diff}₽</p>` : ''}
            </div>
        `;
    });
</script>

</body>
</html>
