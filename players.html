<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игроки | TransfermarktDD</title>
    <link rel="icon" type="image/png" href="https://i.oneme.ru/i?r=BTE2sh_eZW7g8kugOdIm2NotmYZnooSAekas7yjfTkf_0qi4PqKgM2Ek2hqD_lAdUA8">
    <script src="players-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f3f5f7; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #003B7A; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.35); position: relative; z-index: 300; }
        .logo a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
        .logo img { height: 40px; border-radius: 8px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .hamburger { display: none; background: none; border: none; color: white; font-size: 28px; cursor: pointer; padding: 5px; line-height: 1; }
        .theme-toggle { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; line-height: 1; transition: 0.2s; }
        .theme-toggle:hover { transform: scale(1.1); }
        .mobile-buttons { display: none; }
        #mainNav { display: block; }
        .nav-menu { display: flex; list-style: none; gap: 20px; }
        .nav-menu li { position: relative; }
        .nav-menu a { color: white; text-decoration: none; font-weight: 500; padding: 8px 12px; border-radius: 6px; transition: 0.2s; display: block; white-space: nowrap; }
        .nav-menu a:hover { background: rgba(255,255,255,0.15); }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: white; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); list-style: none; padding: 8px 0; min-width: 180px; z-index: 100; }
        .dropdown-menu li a { color: #003B7A; padding: 10px 20px; border-radius: 0; }
        .dropdown-menu li a:hover { background: #e8f0fe; }
        .dropdown:hover .dropdown-menu { display: block; }
        .container { max-width: 1200px; margin: auto; padding: 40px 20px; width: 100%; flex: 1; }
        .back-container { text-align: left; margin-bottom: 10px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #003B7A; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        .section-title { margin-bottom: 25px; color: #003B7A; border-left: 5px solid #00aaff; padding-left: 15px; }

        .filters-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .filters-row label { font-weight: bold; color: #003B7A; font-size: 14px; }
        .filters-row select { padding: 8px 15px; border: 2px solid #003B7A; border-radius: 25px; font-size: 14px; cursor: pointer; background: white; color: #003B7A; font-weight: bold; }

        .table-wrapper { overflow-x: auto; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: #003B7A; color: white; padding: 15px; text-transform: uppercase; font-size: 14px; letter-spacing: 0.5px; cursor: pointer; user-select: none; }
        th:hover { background: #004d9a; }
        th .arrow { font-size: 12px; margin-left: 5px; }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background-color: #f0f7ff; }
        .player-cell { display: flex; align-items: center; gap: 10px; text-align: left; }
        .player-cell img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .player-cell a { color: #003B7A; text-decoration: none; font-weight: bold; }
        .player-cell a:hover { text-decoration: underline; }
        .rating-badge { background: #e8f0fe; color: #003B7A; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 14px; }
        footer { margin-top: auto; background: #003B7A; color: white; padding: 25px; text-align: center; font-size: 14px; }

        body.dark-theme { background: #1a1a2e; }
        body.dark-theme header { background: #16213e; }
        body.dark-theme .section-title { color: #00aaff; }
        body.dark-theme .filters-row label { color: #00aaff; }
        body.dark-theme .filters-row select { background: #0f3460; color: #ccc; border-color: #00aaff; }
        body.dark-theme .table-wrapper { background: #0f3460; }
        body.dark-theme th { background: #16213e; }
        body.dark-theme td { border-bottom: 1px solid #333; color: #e0e0e0; }
        body.dark-theme tbody tr:hover { background-color: #1a1a2e; }
        body.dark-theme .player-cell a { color: #00aaff; }
        body.dark-theme .rating-badge { background: #1a2a3a; color: #00aaff; }
        body.dark-theme .back-link { color: #00aaff; }
        body.dark-theme footer { background: #16213e; }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: center; padding: 15px; }
            .logo { margin-bottom: 10px; }
            .header-right { flex-direction: row; justify-content: center; gap: 10px; }
            .mobile-buttons { display: flex; }
            .hamburger { display: block; }
            .theme-toggle { display: block; }
            #mainNav { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #003B7A; padding: 15px; z-index: 300; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
            #mainNav.open { display: block; }
            .nav-menu { flex-direction: column; gap: 5px; }
            .nav-menu a { padding: 12px 15px; }
            .dropdown-menu { position: static; background: rgba(255,255,255,0.1); box-shadow: none; border-radius: 0; padding-left: 15px; }
            .dropdown-menu li a { color: white; }
            .dropdown-menu li a:hover { background: rgba(255,255,255,0.1); }
        }
    </style>
</head>
<body>
<header>
    <div class="logo">
        <a href="index.html"><img src="https://i.oneme.ru/i?r=BTE2sh_eZW7g8kugOdIm2NotmYZnooSAekas7yjfTkf_0qi4PqKgM2Ek2hqD_lAdUA8" alt="Логотип"> TransfermarktDD</a>
    </div>
    <nav id="mainNav">
        <ul class="nav-menu">
            <li class="dropdown"><a href="#">Трансферы ▾</a><ul class="dropdown-menu"><li><a href="transfers.html">Трансферы</a></li><li><a href="rumors.html">Слухи</a></li></ul></li>
            <li class="dropdown"><a href="#">Рыночные цены ▾</a><ul class="dropdown-menu"><li><a href="market-values.html">Все игроки</a></li></ul></li>
            <li class="dropdown"><a href="#">Турниры ▾</a><ul class="dropdown-menu"><li><a href="tournaments.html">Таблица</a></li><li><a href="schedule.html">Расписание</a></li></ul></li>
            <li><a href="teams.html">Команды</a></li>
            <li><a href="players.html">Игроки</a></li>
            <li><a href="statistics.html">Статистика</a></li>
            <li><a href="news.html">Новости</a></li>
        </ul>
    </nav>
    <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()" title="Переключить тему">🌙</button>
        <div class="mobile-buttons">
            <button class="hamburger" onclick="toggleMenu()">☰</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="back-container"><a href="index.html" class="back-link">← Назад на главную</a></div>
    <h2 class="section-title">👤 Игроки</h2>

    <div class="filters-row">
        <label>Клуб:</label>
        <select id="clubFilter" onchange="renderTable()"><option value="all">Все клубы</option></select>
        <label>Позиция:</label>
        <select id="positionFilter" onchange="renderTable()">
            <option value="all">Все позиции</option>
            <option value="Нападающий">Нападающий</option>
            <option value="Полузащитник">Полузащитник</option>
            <option value="Защитник">Защитник</option>
            <option value="Вратарь">Вратарь</option>
        </select>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th onclick="sortTable('name')">Игрок <span class="arrow" id="arrow-name">▼</span></th>
                    <th>Позиция</th>
                    <th onclick="sortTable('age')">Возраст <span class="arrow" id="arrow-age">▼</span></th>
                    <th>Клуб</th>
                    <th onclick="sortTable('price')">Цена <span class="arrow" id="arrow-price">▼</span></th>
                    <th onclick="sortTable('rating')">Рейтинг <span class="arrow" id="arrow-rating">▼</span></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<footer>© 2026 TransfermarktDD</footer>

<script>
    let currentSort = 'rating', sortDirection = -1;

    function calcRating(p) {
        const s = p.stats; let ageCoef;
        if (p.age >= 8 && p.age <= 11) ageCoef = 0.6;
        else if (p.age >= 12 && p.age <= 13) ageCoef = 0.7;
        else if (p.age >= 14 && p.age <= 15) ageCoef = 0.8;
        else if (p.age >= 16 && p.age <= 18) ageCoef = 1.0;
        else if (p.age >= 19 && p.age <= 21) ageCoef = 0.9; else ageCoef = 0.8;
        let discipline;
        if (s.redCards >= 2) discipline = 0.3;
        else if (s.redCards >= 1) discipline = 0.5;
        else if (s.yellowCards >= 4) discipline = 0.7;
        else if (s.yellowCards >= 2) discipline = 0.9; else discipline = 1.0;
        const priceNorm = p.price / 10;
        const baseRating = (priceNorm * 5 * 0.5) + (ageCoef * 30 * 0.5);
        let seasonBonus = 0;
        if (p.position === 'forward') seasonBonus = (s.goals * 5 * 0.4) + (s.assists * 3 * 0.3) + (s.matches * 1 * 0.2) + (discipline * 50 * 0.1);
        else if (p.position === 'midfielder') seasonBonus = (s.assists * 4 * 0.35) + (s.goals * 3 * 0.25) + (s.matches * 2 * 0.2) + (discipline * 50 * 0.2);
        else if (p.position === 'defender') seasonBonus = (s.matches * 2 * 0.3) + (s.assists * 3 * 0.2) + (s.goals * 4 * 0.15) + (discipline * 50 * 0.35);
        else if (p.position === 'goalkeeper') { const gs = p.goalieStats || { cleanSheets: 0 }; seasonBonus = (gs.cleanSheets * 6 * 0.4) + (s.matches * 2 * 0.2) + (discipline * 50 * 0.4); }
        return Math.round(baseRating + seasonBonus);
    }

    function updateArrows() { document.querySelectorAll('.arrow').forEach(a => a.textContent = '▼'); const a = document.getElementById('arrow-' + currentSort); if (a) a.textContent = sortDirection === 1 ? '▲' : '▼'; }

    function sortTable(field) { if (currentSort === field) sortDirection *= -1; else { currentSort = field; sortDirection = -1; } updateArrows(); renderTable(); }

    function renderTable() {
        let filtered = [...playersData];
        const cf = document.getElementById('clubFilter').value, pf = document.getElementById('positionFilter').value;
        if (cf !== 'all') filtered = filtered.filter(p => p.club === cf);
        if (pf !== 'all') filtered = filtered.filter(p => p.positions.includes(pf));
        filtered.sort((a, b) => {
            let va, vb;
            if (currentSort === 'name') return a.name.localeCompare(b.name) * sortDirection;
            if (currentSort === 'age') { va = a.age; vb = b.age; }
            else if (currentSort === 'price') { va = a.price; vb = b.price; }
            else if (currentSort === 'rating') { va = a.ratingOverride > 0 ? a.ratingOverride : calcRating(a); vb = b.ratingOverride > 0 ? b.ratingOverride : calcRating(b); }
            return (va - vb) * sortDirection;
        });
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
        filtered.forEach((p, i) => {
            const r = p.ratingOverride > 0 ? p.ratingOverride : calcRating(p);
            tbody.innerHTML += `<tr><td>${i+1}</td><td><div class="player-cell"><img src="${p.photo}" alt="${p.name}"><a href="player-${p.id}.html">${p.name}</a></div></td><td>${p.mainPosition}</td><td>${p.age} лет</td><td>${p.club}</td><td>₽ ${p.price}</td><td><span class="rating-badge">${r}</span></td></tr>`;
        });
    }

    const clubs = [...new Set(playersData.map(p => p.club))];
    const cs = document.getElementById('clubFilter'); clubs.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; cs.appendChild(o); });
    renderTable();

    function toggleTheme() { document.body.classList.toggle('dark-theme'); const b = document.querySelector('.theme-toggle'); if (document.body.classList.contains('dark-theme')) { b.textContent = '☀️'; localStorage.setItem('theme', 'dark'); } else { b.textContent = '🌙'; localStorage.setItem('theme', 'light'); } }
    if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-theme'); document.querySelector('.theme-toggle').textContent = '☀️'; }
    function toggleMenu() { document.getElementById('mainNav').classList.toggle('open'); }
</script>
</body>
</html>
